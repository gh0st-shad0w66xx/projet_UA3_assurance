<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Biblio Manager Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <h1>📚 BIBLIO MANAGER PRO</h1>

        <div class="top-panel">
            <input type="text" id="title" placeholder="Titre..." />
            <input type="text" id="author" placeholder="Auteur..." />

            <select id="category">
                <option value="1">Science-Fiction</option>
                <option value="2">Documentaire</option>
                <option value="3">Roman</option>
            </select>

            <input type="text" id="isbn" placeholder="ISBN">
            <button id="btnAdd" class="btn-add">ENREGISTRER</button>

            <br><br>

            Recherche :
            <input type="text" id="search" class="search" placeholder="Rechercher...">
        </div>

        <p id="message"></p>

        <h3>Inventaire (<span id="count">0</span>)</h3>

        <table>
            <thead>
                <tr>
                    <th>Num</th>
                    <th>Info Livre</th>
                    <th>Type</th>
                    <th>Détails</th>
                    <th>Opt</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <br>
        <button id="btnReset" class="btn-reset">⚠️ RAZ</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
