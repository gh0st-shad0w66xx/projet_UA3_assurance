<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblio Manager Pro</title>

    <!-- CSS externe -->
    <link rel="stylesheet" href="style.css">

    <!-- JS externe -->
    <script src="app.js" defer></script>
</head>
<body>

    <div class="wrapper">
        <h1>📚 BIBLIO MANAGER PRO</h1>

        <div class="header-container">

            <!-- Sélecteur de type -->
            <label for="book-type">Type :</label>
            <select id="book-type">
                <option value="1">Science-Fiction</option>
                <option value="2">Documentaire</option>
                <option value="3">Roman</option>
            </select>

            <!-- Bouton d'enregistrement -->
            <button id="save-btn">Enregistrer</button>

            <!-- Recherche -->
            <label for="search">Recherche :</label>
            <input type="text" id="search" placeholder="Rechercher un livre...">

        </div>

        <h3>
            Inventaire (<span id="counter">0</span>)
        </h3>

        <table>
            <thead>
                <tr>
                    <th>Num</th>
                    <th>Info Livre</th>
                    <th>Type</th>
                    <th>Détails</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="book-list">
            </tbody>
        </table>

        <br>

        <!-- Bouton RESET -->
        <button id="reset-btn" class="danger">⚠️ RAZ</button>

    </div>

</body>
</html>
